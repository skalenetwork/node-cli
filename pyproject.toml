[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "node-cli"
version = "3.2.0"
description = "Node CLI tools"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
keywords = ["skale", "cli"]
authors = [
  { name = "SKALE Labs", email = "support@skalelabs.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
  "click==8.3.1",
  "distro==1.9.0",
  "docker==7.1.0",
  "texttable==1.7.0",
  "python-dateutil==2.9.0",
  "Jinja2==3.1.6",
  "psutil==7.1.3",
  "python-dotenv==1.0.1",
  "terminaltables==3.1.10",
  "requests==2.32.3",
  "GitPython==3.1.43",
  "packaging==24.1",
  "python-debian==1.0.1",
  "PyYAML==6.0.1",
  "pyOpenSSL==25.3.0",
  "MarkupSafe==2.1.5",
  "Flask==3.0.3",
  "itsdangerous==2.2.0",
  "cryptography==45.0.7",
  "filelock==3.15.4",
  "sh==2.0.6",
  "python-crontab==3.0.0",
  "requests-mock==1.12.1",
  "redis==5.0.7",
  "PyInstaller==6.16.0",
]

[project.urls]
Homepage = "https://github.com/skalenetwork/node-cli"

[project.optional-dependencies]
dev = [
  "ruff==0.5.5",
  "bumpversion==0.6.0",
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "twine==5.1.1",
  "mock==5.1.0",
  "freezegun==1.5.1",
]

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
