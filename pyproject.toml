[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "node-cli"
version = "3.4.0"
requires-python = ">=3.14"
dependencies = [
  "click==8.5.1",
  "distro==1.9.0",
  "docker==7.2.0",
  "texttable==1.7.3",
  "Jinja2==3.1.6",
  "psutil==7.2.2",
  "python-dotenv==1.2.4",
  "requests==2.34.2",
  "GitPython==3.2.1",
  "packaging==26.3",
  "python-debian==1.1.1",
  "PyYAML==6.0.3",
  "Flask==3.1.3",
  "cryptography==50.0.2",
  "filelock==4.2.10",
  "python-crontab==3.4.0",
  "redis==8.1.0",
  "PyInstaller==6.22.3",
  "skale.py-core==8.0dev0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.17.5",
  "pytest==9.2.0",
  "freezegun==1.5.5",
  "requests-mock==1.12.1",
]

[tool.setuptools.packages.find]
include = ["node_cli*"]

[tool.ruff]
line-length = 100
extend-exclude = ["helper-scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = ["ignore::DeprecationWarning"]
