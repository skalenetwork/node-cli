health:
  help: Node health commands
  containers:
    help: List of SKALE containers running on connected node
  schains_checks:
    help: List of health checks for sChains served by the node
  sgx:
    help: Info about connected SGX server

common:
  json: Show data in JSON format

node:
  base: "SKALE node commands"
  info: "Info about SKALE node"
  registered: |-
    Node registered in SKALE manager.
    For more info run < skale node info >
  status:
    ACTIVE: Active
    LEAVING: Leaving
    FROZEN: Frozen
    LEFT: Left
    IN_MAINTENANCE: In Maintenance
  maintenance_on: Node is successfully set in maintenance mode
  maintenance_off: Node is successfully removed from maintenance mode
  not_inited: |-
    Node hasn't been inited before.
    You should run < skale node init >
  already_inited: Node was already inited before.
  cmd_failed: |-
    Command failed. Please, check out < skale logs cli >
    and logs from docker containers for more information
  domain_name_changed: Domain name successfully changed
wallet:
  successful_transfer: "Funds were successfully transferred"

service:
  node_not_registered: This SKALE node is not registered on SKALE Manager yet

ssl:
  no_cert: |-
    No SSL certificates on the node.
    Run < skale ssl upload > to add new certificates.
  uploaded: |-
    Certificates are successfully uploaded.
    You can check status by running < skale ssl status >
  check_passed: |-
    Check passed

exit:
  start: |
    Node exit process is started. Please, wait until exiting process will be completed
    To check current state of exiting process try:

      skale exit status
  status:
    active: "Exiting is not started. Node is active"
    in_progress: "Node exiting is in progress"
    wait_for_rotations: "Node is waiting to finish rotations"
    completed: "Node exiting is completed"

passive_node:
  init:
    help: Initialize passive SKALE node
    indexer: Run passive node in indexer mode (disable block rotation)
    archive: Enable historic state and disable block rotation
    snapshot_from: IP of the node to take snapshot from
    snapshot: Start passive node from snapshot

lvmpy:
  help: Lvmpy commands
  run:
    help: Run lvmpy http server
    prompt: Are you sure you want to run lvmpy server?
  heal:
    help: Run healing procedure for lvmpy server
    prompt: Are you sure you want run healing procedure?

fair:
  node:
    repair:
      help: Repair Fair chain node
      warning: Are you sure you want to repair Fair chain node? In rare cases may cause data loss and require additional maintenance
      snapshot: IP of the node to take snapshot from (put "any" to use any available node)
      repair_requested: Repair mode is requested
    not_inited: Node should be initialized to proceed with operation

    setup:
      help: Setup passive Fair node
      id: ID of the node in Fair manager

    registered: Node is registered in Fair manager.
    setup_complete: Passive node setup complete.
    register:
      help: Register node in Fair manager
      ip: IP address of the node in Fair manager
    ip_changed: Node IP changed in Fair manager
    change-ip:
      help: Change the node IP in Fair manager
    exited: Node removed from Fair manager
    exit:
      help: Remove node from Fair manager
      prompt: Are you sure you want to remove the node from Fair manager?

sgx:
  help: SGX wallet options and client certificate commands
  no_sgx: This node has no SGX server configured (passive nodes do not use SGX)
  options:
    help: Show SGX server options through the node API
  status:
    help: Show the SGX client certificate used by node services
    check: Also verify that the SGX server accepts the certificate
    missing: |-
      SGX client certificate files are missing.
      Node services create them on their first SGX request, or run < skale sgx renew >
    expired: SGX client certificate has expired. Run < skale sgx renew >
    expires_soon: "SGX client certificate expires in {days} days. Consider running < skale sgx renew >"
    key_mismatch: Private key does not match the certificate. Run < skale sgx renew >
  renew:
    help: Issue a new SGX client certificate and install it for node services
    prompt: Are you sure you want to replace the SGX client certificate of this node?
    timeout: Seconds to wait for the SGX server to sign the request
    skip_verify: Install the certificate without testing it against the SGX server first
    backup: "Previous certificate files were copied to {path}"
    done: |-
      New SGX client certificate installed.
      Node services use it on their next SGX request; no restart is needed.
