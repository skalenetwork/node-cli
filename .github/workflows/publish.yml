name: Build and publish

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - beta
      - stable
      - 'v*.*.*'

jobs:
  build_and_release:
    if: github.event.pull_request.merged
    name: Build and create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.base_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Calculate version
        run: |
          export VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "VERSION=$(bash ./helper-scripts/calculate_version.sh)" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          mkdir -p ./dist
          docker build . -t node-cli-builder
          docker run --rm -v "$PWD/dist":/app/dist node-cli-builder bash scripts/build.sh "$VERSION" "$BRANCH" skale
          docker run --rm -v "$PWD/dist":/app/dist node-cli-builder bash scripts/build.sh "$VERSION" "$BRANCH" fair

      - name: Generate checksums
        working-directory: dist
        run: |
          for file in skale-*; do
            sha512sum "$file" > "$file.sha512"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.VERSION }}
          prerelease: ${{ github.base_ref != 'stable' }}
          generate_release_notes: true
          files: dist/skale-*
