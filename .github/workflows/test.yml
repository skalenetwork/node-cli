name: Test
on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.8"

    - name: Install python dependencies
      run: uv sync --all-extras

    - name: Generate info
      run: bash ./scripts/generate_info.sh test test skale

    - name: Check with ruff
      run: |
        uv run ruff check

    - name: Build docker image
      run: docker build . -t node-cli-builder

    - name: Build binary - skale
      run: |
        mkdir -p ./dist
        docker run --rm -v "$PWD/dist":/app/dist node-cli-builder bash scripts/build.sh test test skale

    - name: Check build - skale
      run: sudo ./dist/skale-test-Linux-x86_64

    - name: Build binary - fair
      run: |
        docker run --rm -v "$PWD/dist":/app/dist node-cli-builder bash scripts/build.sh test test fair

    - name: Check build - fair
      run: sudo ./dist/skale-test-Linux-x86_64-fair

    - name: Run nftables tests
      run: |
        bash ./scripts/run_nftables_test.sh

    - name: Run tests
      run: |
        uv run bash ./scripts/run_tests.sh
